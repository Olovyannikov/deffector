# Builds the documentation site (website/, VitePress) and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # the site serves a live build of the React demo
      - 'demo/shared/**'
      - 'demo/react-vite/**'
      - 'packages/agent/**'
      - 'packages/protocol/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push does not cancel a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: "last updated" dates come from git

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      # base defaults to /deffector/; set the DOCS_BASE repository variable for another repo name or '/' for a custom domain
      - run: npm run docs:build
        env:
          DOCS_BASE: ${{ vars.DOCS_BASE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
